<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Rex 3 Health Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        body { font-family: system-ui, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; margin: 0; }
        h1 { font-size: 1.5rem; margin-top: 10px; }
        .card { background: #1e1e1e; padding: 20px; margin: 15px auto; border-radius: 12px; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .metric { font-size: 2.5rem; font-weight: bold; }
        .timestamp { color: #888; font-size: 0.85rem; margin-top: 5px; }
        .file-box { border: 2px dashed #444; padding: 15px; border-radius: 8px; margin-top: 20px; }
        input[type="file"] { color: #aaa; margin-top: 10px; width: 100%; }
    </style>
</head>



<body>

    <h1>T-Rex 3 Dashboard</h1>
    <p style="color: #888; font-size: 0.9rem;">100% Offline • Zero Cloud</p>

      <!-- Install App Banner (Android/Chrome shows a real install button; iOS shows Add-to-Home-Screen instructions) -->
<div id="pwaInstallContainer" class="hidden mt-3 flex justify-center">
  <button
    id="pwaInstallBtn"
    class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow-md transition"
  >
    📲 Install App
  </button>
</div>

    <div class="card">
        <p style="margin: 0; color: #aaa;">Steps</p>
        <div class="metric" id="steps-val">0</div>
    </div>

    <div class="card">
        <p style="margin: 0; color: #aaa;">Calories Burned</p>
        <div class="metric" id="calories-val" style="color: #ffa500;">0 kcal</div>
    </div>

    <div class="card">
        <p style="margin: 0; color: #aaa;">Workouts Logged</p>
        <div class="metric" id="workouts-val" style="color: #00ffff;">0</div>
        <div class="timestamp" id="time-val">Last synced: Never</div>
    </div>

    <div class="card file-box">
        <p style="margin: 0; font-size: 0.95rem;">Select Watch Sync File:</p>
        <input type="file" id="file-input" accept=".json">
    </div>

    <script>
        function updateUI(data) {
            if (!data) return;
            document.getElementById('steps-val').innerText = data.steps || 0;
            document.getElementById('calories-val').innerText = `${data.calories || 0} kcal`;
            document.getElementById('workouts-val').innerText = data.workouts ? data.workouts.length : 0;
            document.getElementById('time-val').innerText = `Last synced: ${data.updatedAt || 'Unknown'}`;
        }

        document.getElementById('file-input').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const jsonData = JSON.parse(e.target.result);
                    updateUI(jsonData);
                } catch (err) {
                    alert('Invalid JSON data file.');
                }
            };
            reader.readAsText(file);
        });

  if ('serviceWorker' in navigator) {
     window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
   }

    </script>
    <script src="install-pwa.js"></script>
</body>
</html>
